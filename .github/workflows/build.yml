name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Unzip Project
      run: unzip full_project.zip
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      run: |
        cd "APPS&Source-Code/source code/apk src code v3(Kotlin)"
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: "APPS&Source-Code/source code/apk src code v3(Kotlin)/app/build/outputs/apk/debug/app-debug.apk"
